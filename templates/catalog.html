<!DOCTYPE html>
<html lang="uk">
<head>

    <title>Каталог пам’ятників</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<section class="catalog">

    <div class="card">

    <div class="card">

        <h3>Горизонтальний пам’ятник</h3>
        <p class="price">від 30 000 ₴</p>
    </div>

    <div class="card">
        <img src="{{ url_for('static', filename='images/p3.jpg') }}" alt="Сімейний комплекс">
        <h3>Сімейний комплекс</h3>
        <p class="price">від 50 000 ₴</p>

</html>
